name: kapdakhata
description: KapdaKhata - Clothing shop management app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.31
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^15.1.2
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  share_plus: ^11.0.0
  file_picker: ^10.1.2
  uuid: ^4.5.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: logos/android-chrome-512x512.png
  remove_alpha_ios: true
  background_color_ios: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: logos/android-chrome-512x512.png
  web:
    generate: true
    image_path: logos/android-chrome-512x512.png
    background_color: "#000000"
    theme_color: "#7132F5"
  windows:
    generate: true
    image_path: logos/android-chrome-512x512.png
  macos:
    generate: true
    image_path: logos/android-chrome-512x512.png

flutter:
  uses-material-design: true
  assets:
    - logos/android-chrome-192x192.png
    - logos/android-chrome-512x512.png
    - logos/apple-touch-icon.png
    - logos/favicon-32x32.png
